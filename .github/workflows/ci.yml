name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.12 = package.json engines 声明的下限（验证它不虚；
        # 20.10/20.11 无 DecompressionStream('deflate-raw')，实测失败）；
        # 22 = 维护期 LTS；24 = 当前 LTS。
        node-version: ['20.12', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci 会执行 prepare（= npm run build），构建失败在此暴露。
      - run: npm ci

      - run: npm run typecheck

      # npm test = 固定分片 runner（scripts/test-shards.mjs）。GitHub runner 只有 2 核，
      # 分片反而更慢（每片都要重新起 Node + 转换缓存），所以 CI 显式要求单片。
      # 每片内部仍是 --maxWorkers=1 --no-file-parallelism，事故防护（2026-10-05 内存耗尽）
      # 一条都没松。
      - run: npm test
        env:
          QIYU_TEST_SHARDS: 1
